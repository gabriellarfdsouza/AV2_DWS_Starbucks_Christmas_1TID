<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio | Starbucks Christmas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsivo.css">

    <script src="js/produtos.js" defer></script>
    <script src="js/script.js" defer></script>
</head>

<body class="pagina-vitrine">

    <header>
        <h1 class="logo">Starbucks Christmas</h1>
        <p>The Magic of Christmas Starts Here</p>

        <button class="botao-menu" id="botao-menu" aria-label="Abrir menu" aria-expanded="false">☰</button>

        <nav class="menu" id="menu">
            <a href="index.html">Início</a>
            <a class="ativo" href="produtos.html">Cardápio</a>
            <a href="sobre.html">Sobre nós</a>
            <a href="galeria.html">Natal</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <h2>Nosso Cardápio</h2>
        <p>Confira nossas bebidas, comidas e sabores especiais.</p>

        <div class="filtros-produtos">
            <div>
                <label for="busca">Buscar produto</label>
                <input id="busca" type="search" placeholder="Digite o nome do produto" autocomplete="off">
            </div>

            <div>
                <label for="categoria">Categoria</label>
                <select id="categoria">
                    <option value="todos">Todas as categorias</option>
                    <option value="bebidas">Bebidas</option>
                    <option value="comidas">Comidas e doces</option>
                    <option value="natal">Especial de Natal</option>
                </select>
            </div>
            <div>
    <label for="ordenacao">Ordenar por preço</label>
    <select id="ordenacao">
        <option value="padrao">Ordem padrão</option>
        <option value="menor">Menor preço</option>
        <option value="maior">Maior preço</option>
    </select>
</div>
        </div>

        <p id="resultado-produtos" class="resultado-produtos" aria-live="polite"></p>

        <section id="lista-produtos" class="grade-produtos" aria-label="Produtos disponíveis"></section>
    </main>

    <!-- JANELA DE DETALHES DO PRODUTO -->
    <div id="modal-produto" class="modal-produto" hidden>
        <div class="modal-conteudo" role="dialog" aria-modal="true" aria-labelledby="modal-nome">

            <button type="button" id="fechar-modal" class="fechar-modal" aria-label="Fechar janela">
                &times;
            </button>

            <img id="modal-imagem" src="" alt="">

            <div class="modal-informacoes">
                <h2 id="modal-nome"></h2>
                <p id="modal-descricao"></p>
                <p id="modal-preco" class="preco-produto"></p>
            </div>

        </div>
    </div>

    <footer>
        <p>Starbucks Christmas - Projeto escolar</p>
        <p>The Magic of Christmas Starts Here</p>
    </footer>

</body>
</html>
